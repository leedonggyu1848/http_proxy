name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install nss
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libnss3-tools \
            pkg-config
      - name: Validate release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/package.py --validate
      - name: Show Rust version
        run: rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package allowlisted files
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: http-proxy-${{ github.sha }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: http-proxy-${{ github.sha }}-${{ matrix.target }}
          path: downloaded
      - name: Install Linux runtime smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes xvfb
      - name: Run downloaded binary (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/smoke-package.py downloaded
      - name: Run downloaded binary (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-package.py downloaded

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Check dependencies
        run: cargo deny check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, dependencies]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: http-proxy-*
          merge-multiple: true
          path: dist
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 3
          test "$(find dist -name '*.sha256' | wc -l)" -eq 3
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
