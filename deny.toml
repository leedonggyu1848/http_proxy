[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
	# Transitive dependencies of eframe 0.37 -> accesskit_unix -> zbus 5.19.
	# No safe upgrade is available until accesskit_unix migrates to zbus 6.
	{ id = "RUSTSEC-2026-0370", reason = "zvariant is pulled in transitively by eframe 0.37 / accesskit_unix (zbus 5); remove once accesskit_unix upgrades to zbus 6" },
	{ id = "RUSTSEC-2026-0371", reason = "zbus_names is pulled in transitively by eframe 0.37 / accesskit_unix (zbus 5); remove once accesskit_unix upgrades to zbus 6" },
	{ id = "RUSTSEC-2026-0372", reason = "zvariant_derive is pulled in transitively by eframe 0.37 / accesskit_unix (zbus 5); remove once accesskit_unix upgrades to zbus 6" },
]

[licenses]
confidence-threshold = 0.8
allow = [
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"MIT",
	"OFL-1.1",
	"Unicode-3.0",
	"Ubuntu-font-1.0",
	"Zlib",
]

# Windows-only clipboard backends pulled in by eframe's `clipboard` feature.
# BSL-1.0 is OSI-approved and permissive; allow it only for these crates.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# CSS syntax tokenizer and its serializer helpers; no upstream files are modified.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
