[package]
name = "http-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A Linux and macOS desktop HTTP network inspector"
license = "MIT"
repository = "https://github.com/leedonggyu1848/http_proxt"
publish = false

[dependencies]
brotli-decompressor = "6"
bytes = "1"
eframe = { version = "0.37", default-features = false, features = [
	"accesskit",
	"clipboard",
	"default_fonts",
	"glow",
] }
egui_extras = { version = "0.37", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
png = "0.18"
quick-xml = { version = "0.41", default-features = false }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = [
	"ring",
	"std",
	"tls12",
] }
rustls-native-certs = "0.8"
serde_json = "1"
sha2 = "0.10"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
thiserror = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = [
	"io-util",
	"macros",
	"net",
	"process",
	"rt-multi-thread",
	"sync",
	"time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
	"logging",
	"ring",
	"tls12",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zstd = { version = "0.13", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }
cssparser = "0.38.0"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
