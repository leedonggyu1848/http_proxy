[workspace]
resolver = "3"
members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/leedonggyu1848/http_proxy"
publish = false

[workspace.dependencies]
aho-corasick = "1.1"
brotli-decompressor = "6"
bytes = "1"
clap = { version = "4.6", default-features = false, features = [
	"derive",
	"error-context",
	"help",
	"std",
	"usage",
] }
criterion = { version = "0.8.2", default-features = false }
cssparser = "0.38.0"
eframe = { version = "0.37", default-features = false, features = [
	"accesskit",
	"clipboard",
	"default_fonts",
	"glow",
] }
egui_extras = { version = "0.37", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
gif = { version = "0.14", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
http-inspector-analysis = { path = "crates/http-inspector-analysis" }
http-inspector-cli = { path = "crates/http-inspector-cli" }
http-inspector-content = { path = "crates/http-inspector-content" }
http-inspector-core = { path = "crates/http-inspector-core" }
http-inspector-encoding = { path = "crates/http-inspector-encoding" }
http-inspector-exchange = { path = "crates/http-inspector-exchange" }
http-inspector-file = { path = "crates/http-inspector-file" }
http-inspector-interop = { path = "crates/http-inspector-interop" }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["bmp", "ico"] }
image-webp = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
memchr = "2.8"
png = "0.18"
psl = "2"
quick-xml = { version = "0.41", default-features = false }
rcgen = { version = "0.14", features = ["x509-parser"] }
regex-automata = "0.4"
resvg = { version = "0.50", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }
rustls = { version = "0.23", default-features = false, features = [
	"ring",
	"std",
	"tls12",
] }
rustls-native-certs = "0.8"
serde_json = "1"
sha2 = "0.10"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = [
	"io-util",
	"macros",
	"net",
	"process",
	"rt-multi-thread",
	"sync",
	"time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
	"logging",
	"ring",
	"tls12",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x509-parser = { version = "0.18", default-features = false }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[package]
name = "http-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Desktop HTTP network inspector for Linux and macOS"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
egui_extras.workspace = true
http.workspace = true
http-inspector-analysis.workspace = true
http-inspector-cli.workspace = true
http-inspector-content.workspace = true
http-inspector-core.workspace = true
http-inspector-exchange.workspace = true
http-inspector-file.workspace = true
http-inspector-interop.workspace = true
png.workspace = true
serde_json.workspace = true
skrifa.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
aho-corasick.workspace = true
bytes.workspace = true
criterion.workspace = true
flate2.workspace = true
http-body.workspace = true
http-body-util.workspace = true
http-inspector-exchange = { workspace = true, features = ["test-support"] }
hyper.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
time.workspace = true
tokio-rustls.workspace = true

[[bench]]
name = "search"
harness = false

[[bench]]
name = "url_map"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11"] }

[lints]
workspace = true

# Linux .deb package built by `cargo deb --no-build` in CI. See docs/development.md.
[package.metadata.deb]
name = "http-inspector"
maintainer = "leedonggyu1848 <53461960+leedonggyu1848@users.noreply.github.com>"
copyright = "2026 이동규"
license-file = ["LICENSE", "0"]
extended-description = """\
Desktop app that records HTTP requests and responses passing through a local \
proxy, and optionally decrypts HTTPS traffic with a locally generated CA. \
Requires an X11 display."""
section = "net"
priority = "optional"
# The X11 and OpenGL libraries are loaded at runtime with dlopen, so $auto
# cannot see them. Keep this list in sync with the README runtime packages.
depends = "$auto, libgl1, libegl1, libx11-6, libxkbcommon0, libxkbcommon-x11-0, libxcursor1, libxi6, libxrandr2"
# NSS certutil is needed only to register the HTTPS inspection CA.
recommends = "libnss3-tools"
assets = [
	["target/release/http-proxy", "usr/bin/", "755"],
	["packaging/linux/http-inspector.desktop", "usr/share/applications/", "644"],
	["assets/icons/http-inspector.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
	["assets/icons/http-inspector-256.png", "usr/share/icons/hicolor/256x256/apps/http-inspector.png", "644"],
	["README.md", "usr/share/doc/http-inspector/", "644"],
	["CHANGELOG.md", "usr/share/doc/http-inspector/", "644"],
	["assets/fonts/OFL.txt", "usr/share/doc/http-inspector/FONT-LICENSE.txt", "644"],
]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
